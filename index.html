body{margin:0;background:var(--bg);color:var(--t);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-size:15px;line-height:1.75}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--n);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
header b{flex:1;font-size:16px}header button{background:none;color:#fff;font-size:22px;padding:2px 8px}
#dr{position:fixed;top:0;bottom:0;right:0;width:260px;background:var(--n);color:#fff;z-index:20;transform:translateX(100%);transition:.2s;padding:calc(16px + env(safe-area-inset-top,0px)) 0 16px;overflow-y:auto}
#dr.o{transform:none}#dr .lg{display:flex;justify-content:center;margin-bottom:14px}#dr .lg img{width:70px;border-radius:8px;background:#fff}
#dr a{display:block;padding:12px 18px;color:#cbd5e1;cursor:pointer;font-size:14px}#dr a.on{background:rgba(255,255,255,.1);color:#fff;border-right:3px solid #60a5fa}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}#ov.o{display:block}
main{max-width:720px;margin:auto;padding:12px 12px 90px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:16px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--b);border-radius:9px;background:var(--bg);color:var(--t);font:inherit}
textarea{resize:vertical;min-height:70px}input[type=checkbox]{width:auto;margin-left:8px}
label{display:block;font-size:12px;color:var(--m);margin:9px 0 3px}label.ck{font-size:14px;color:var(--t)}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--a);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--a);border:1px solid var(--a)}button.r{background:#dc2626}button.w{width:100%}button.s{padding:6px 10px;font-size:13px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.row input{flex:1;min-width:0}
.row input[type=number]{padding:9px 2px;text-align:center;direction:ltr;min-width:44px;-moz-appearance:textfield}.row input[type=number]::-webkit-inner-spin-button,.row input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.dwrap{flex:1.1;min-width:54px;max-width:86px;display:flex;flex-direction:column;gap:3px}.dwrap input{flex:none!important;width:100%}.row input:first-child{flex:3}
.sar-i{display:inline-block;width:.78em;height:.87em;vertical-align:-.07em;overflow:visible}.mny{white-space:nowrap;unicode-bidi:isolate}
.nsg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.nsg label{margin:0;font-size:12px}.nsprev{margin-top:8px;background:#fff;color:#333;border-radius:8px;padding:10px;min-height:40px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.acts button{flex:1;min-width:120px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.k{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px}.k .m{font-size:12px}.k b{font-size:18px;display:block;margin-top:4px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.big{font-weight:700;font-size:17px;border-top:1px solid var(--b);margin-top:4px;padding-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--b);cursor:pointer}
.custpick{position:relative}
.custpick-list{display:none;position:absolute;z-index:8;top:100%;right:0;left:0;background:var(--c);border:1px solid var(--b);border-radius:9px;max-height:220px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.custpick-list>div{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--b)}
.custpick-list>div:last-child{border-bottom:none}
.custpick-list>div:hover{background:var(--bg)}
.daterange{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.daterange input{flex:1;min-width:130px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.seg button{flex:1;background:var(--bg);color:var(--t);border:1px solid var(--b)}.seg button.on{background:var(--a);color:#fff}
.bd{font-size:11px;padding:2px 8px;border-radius:20px;color:#fff;white-space:nowrap}.bd.g{background:#16a34a}.bd.o{background:#d97706}.bd.r{background:#dc2626}.bd.d{background:#6b7280}
.bar{height:8px;background:var(--b);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
.m{color:var(--m);font-size:13px}.err{color:#dc2626;min-height:20px;margin:4px 0;font-size:14px}
details{border:1px solid var(--b);border-radius:10px;margin-bottom:8px;padding:8px 12px}details summary{cursor:pointer;font-weight:600}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:24px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}#toast.show{opacity:1}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.mb .card{max-width:380px;width:100%;margin:0}

.doc{background:#fff;color:#111;width:794px;min-height:1123px;padding:48px 52px;font-family:var(--doc-font);box-shadow:0 2px 14px rgba(0,0,0,.2);font-size:14px;line-height:1.7;position:relative;display:flex;flex-direction:column}
.docfoot{margin-top:auto;padding-top:28px}
.doc-rcp{width:1123px;min-height:794px;padding:44px 60px}

.dno{margin-top:22px}.dno{text-align:right}.dno .n{font-size:20px;font-weight:700;text-align:right}.dno .dt{font-size:13px;color:#444;margin-top:8px}
.dh-l{text-align:left;direction:rtl;flex:1;padding-top:6px}.dh-l .cn{font-size:var(--doc-name-size);font-weight:700;line-height:1.5}.sm{font-size:12.5px;color:#444;line-height:1.7}

.custname{font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;font-weight:700;font-size:18px;color:#111}
.custdetail{font-size:11px;color:#555;line-height:1.6;margin-top:2px}
.dtitle{text-align:var(--doc-title-align);font-weight:700;font-size:var(--doc-title-size);margin:var(--doc-title-gap) 0 18px}

.sl .tr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}.sl .tr.b{font-weight:700;font-size:15px}

.rv td{padding:14px 10px;border-bottom:1px solid #999;font-size:15px}

.rvfield{display:flex;align-items:baseline;gap:10px;margin:22px 0}

.seal{width:150px;height:150px;display:block;margin:0 auto 4px;transform:rotate(-6deg);opacity:.92}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2600)}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=x=>Math.round((x+Number.EPSILON)*100)/100,f=x=>r2(x||0).toFixed(2);
/* Reconciliation-safe VAT calc: base+vat is guaranteed to equal total exactly (to the cent) in both directions. */
function computeVAT(amount,mode){
 amount=r2(+amount||0);
 if(mode==='excl'){ // amount entered is WITHOUT VAT -> add VAT
  const base=amount,vat=r2(base*0.15),total=r2(base+vat);
  return{base,vat,total}}
 // amount entered is WITH VAT (inclusive) -> extract VAT
 const total=amount,vat=r2(total*15/115),base=r2(total-vat);
 return{base,vat,total}}
let vatState={amount:'',mode:'excl'};
function pVatCalc(v){v.innerHTML=`<div class="wide"><div class="card">
 <h2>🧮 حساب ضريبة القيمة المضافة (15%)</h2>
 <label>المبلغ</label><input id="vatAmt" type="number" inputmode="decimal" placeholder="أدخل المبلغ" value="${esc(vatState.amount)}" oninput="vatState.amount=this.value;updVatCalc()">
 <div class="seg" style="margin-top:10px">
 <button class="${vatState.mode==='excl'?'on':''}" onclick="vatState.mode='excl';draw()">إضافة الضريبة (المبلغ غير شامل)</button>
 <button class="${vatState.mode==='incl'?'on':''}" onclick="vatState.mode='incl';draw()">استبعاد الضريبة (المبلغ شامل)</button>
 </div>
 <div id="vatResult" style="margin-top:16px"></div>
 </div></div>`;updVatCalc()}
function updVatCalc(){const e=document.getElementById('vatResult');if(!e)return;
 const r=computeVAT(vatState.amount,vatState.mode);
 e.innerHTML=`<div class="tot"><span>المبلغ غير شامل الضريبة</span><span>${money(r.base)}</span></div>
 <div class="tot"><span>ضريبة القيمة المضافة (15%)</span><span>${money(r.vat)}</span></div>
 <div class="tot big"><span>المبلغ شامل الضريبة</span><span>${money(r.total)}</span></div>`}

 }catch(e){return padNo(kind,localN)}}

/* draw Arabic notes as images before export: the export engine can break Arabic letter joining in free text */
async function noteToImg(el){const txt=el.getAttribute('data-txt');if(!txt)return;const cs=getComputedStyle(el);
 const size=parseFloat(cs.fontSize)||12.5,wt=cs.fontWeight||'400',fam=cs.fontFamily,lh=size*1.8,font=`${wt} ${size}px ${fam}`;
 try{if(document.fonts&&document.fonts.load)await document.fonts.load(font,txt)}catch(e){}
 const W=Math.max(10,el.clientWidth-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0));
 const m=document.createElement('canvas').getContext('2d');m.font=font;m.direction='rtl';
 const lines=[];String(txt).split(/\r?\n/).forEach(par=>{const ws=par.split(/\s+/).filter(Boolean);if(!ws.length){lines.push('');return}let cur='';ws.forEach(w=>{const t=cur?cur+' '+w:w;if(cur&&m.measureText(t).width>W){lines.push(cur);cur=w}else cur=t});lines.push(cur)});
 const sc=3,cv=document.createElement('canvas');cv.width=Math.ceil(W*sc);cv.height=Math.ceil(lines.length*lh*sc);const c=cv.getContext('2d');c.scale(sc,sc);c.font=font;c.direction='rtl';c.textAlign='right';c.textBaseline='middle';c.fillStyle=cs.color||'#333';
 lines.forEach((ln,i)=>c.fillText(ln,W,i*lh+lh/2));
 el.innerHTML=`<img alt="" src="${cv.toDataURL('image/png')}" style="display:block;width:${W}px;height:${lines.length*lh}px">`}

const MONTH_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function monthlySalesSeries(){const n=new Date(),ii=iss('inv'),out=[];
 for(let k=11;k>=0;k--){const d=new Date(n.getFullYear(),n.getMonth()-k,1),y=d.getFullYear(),m=d.getMonth();
  const total=ii.filter(x=>{const dx=new Date(x.date);return dx.getFullYear()===y&&dx.getMonth()===m}).reduce((s,x)=>s+x.total,0);
  out.push({label:MONTH_AR[m]+' \''+String(y).slice(2),total:r2(total)})}
 return out}
function yearlySalesSeries(){const ii=iss('inv'),years=[...new Set(ii.map(x=>new Date(x.date).getFullYear()))].sort();
 return years.map(y=>({y,total:r2(ii.filter(x=>new Date(x.date).getFullYear()===y).reduce((s,x)=>s+x.total,0))}))}

 const ms=monthlySalesSeries(),maxM=Math.max(1,...ms.map(x=>x.total));
 const ys=yearlySalesSeries(),maxY=Math.max(1,...ys.map(x=>x.total));
 const bars=ms.map(x=>`<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:26px">
  <div style="width:100%;height:90px;display:flex;align-items:flex-end;justify-content:center" title="${f(x.total)} ريال">
   <div style="width:70%;background:var(--a);border-radius:4px 4px 0 0;min-height:2px;height:${Math.max(2,Math.round(x.total/maxM*90))}px"></div>
  </div>
  <span class="m" style="font-size:10px;margin-top:4px;white-space:nowrap">${x.label}</span>
 </div>`).join('');
 const yrows=ys.length?ys.map(x=>`<div class="tot"><span>${x.y}</span><b>${f(x.total)}</b></div><div class="bar" style="margin-bottom:10px"><i style="width:${Math.max(2,Math.round(x.total/maxY*100))}%"></i></div>`).join(''):'<div class="m">لا توجد بيانات كافية بعد</div>';
 return `<div class="card"><h2>📊 المبيعات الشهرية (آخر 12 شهر)</h2>
 <div style="display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding-top:8px">${bars}</div></div>
 <div class="card"><h2>📈 مقارنة المبيعات السنوية</h2>${yrows}</div>`}

/* Real browser download (no Claude runtime dependency — this is a standalone website now) */
async function browserSaveFile(filename,data){
 try{
  const blob=(data instanceof Blob)?data:new Blob([data]);
  if(typeof navigator!=='undefined'&&navigator.share&&navigator.canShare){
   try{
    const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare({files:[file]})){await navigator.share({files:[file]});return true}
   }catch(shareErr){if(shareErr&&shareErr.name==='AbortError')return true}}
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);
  return true
 }catch(e){console.error('download failed',e);return false}}
const nativeDL={save:async({filename,data})=>{
 const ok=await browserSaveFile(filename,data);
 if(!ok)throw new Error('download failed');
 return{status:'saved'}}};
const DLP=Promise.resolve(nativeDL);

  return await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false})}finally{box.remove()}}
async function buildPdfBlob(cv,landscape){
 const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('تعذّر تحميل أداة PDF، تحقق من الإنترنت');
 const maxW=landscape?297:210,maxH=landscape?210:297;
 const pdf=new J({unit:'mm',format:'a4',orientation:landscape?'landscape':'portrait'});
 let w=maxW,h=cv.height*maxW/cv.width;if(h>maxH){w=cv.width*maxH/cv.height;h=maxH}
 pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',(maxW-w)/2,(maxH-h)/2,w,h);
 return pdf.output('blob')}

function noteAdjust(invNo){return st.cnotes.filter(n=>n.invNo===invNo).reduce((s,n)=>s+(n.type==='credit'?-n.amount:n.amount),0)}
function openNote(invNo,type,isReturn){const inv=st.inv.find(i=>i.no===invNo);if(!inv)return;
 if(isReturn){nd={invNo,cid:inv.cid,type:'credit',isReturn:true,incl:!!inv.incl,gdp:(inv.gross>0&&inv.gdisc>0)?inv.gdisc/inv.gross*100:0,ns:lastNs(),date:today(),items:inv.l.map(l=>({...l,retQty:l.q})),reason:'إرجاع بضاعة'};go('note');return}
 nd={invNo,cid:inv.cid,type,isReturn:false,date:today(),amount:0,reason:''};go('note')}
function startReturnByNo(){const no=V('retno');if(!no)return showErr('اكتب رقم الفاتورة');
 const inv=st.inv.find(i=>i.no===no);if(!inv)return showErr('لا توجد فاتورة صادرة بهذا الرقم');
 openNote(no,'credit',true)}
function retAmount(){return calc(nd.items.filter(l=>l.retQty>0).map(retLine),nd.incl,nd.gdp,'p').total}
function updRetTotal(){const e=document.getElementById('rettot');if(e)e.textContent=f(retAmount())}
function pNote(v){const inv=st.inv.find(i=>i.no===nd.invNo);
 if(nd.isReturn){
  v.innerHTML=`<div class="wide"><div class="card"><h2>🔁 فاتورة مرتجعة — ${esc(nd.invNo)}</h2>
  <div class="m">العميل: ${esc(cn(inv))} · إجمالي الفاتورة الأصلية: ${f(inv.total)}</div>
  <label>التاريخ</label><input type="date" value="${nd.date}" onchange="nd.date=this.value">
  <label>الأصناف المرتجعة (عدّل الكمية المرتجعة لكل صنف، أو اجعلها صفراً لاستبعاده)</label>
  <div class="row m" style="margin-bottom:2px"><span style="flex:3">الصنف</span><span style="flex:1">الكمية الأصلية</span><span style="flex:1">كمية الإرجاع</span><span style="flex:1">السعر</span></div>
  ${nd.items.map((l,i)=>`<div class="row"><span style="flex:3">${esc(l.n)}</span><span style="flex:1;text-align:center">${l.q}</span><input type="number" min="0" max="${l.q}" step="any" value="${l.retQty}" style="flex:1" oninput="nd.items[${i}].retQty=Math.min(${l.q},Math.max(0,+this.value));updRetTotal()"><span style="flex:1;text-align:center">${f(l.p)}</span></div>`).join('')}
  <label style="margin-top:10px">السبب / ملاحظة (تظهر أسفل المستند)</label><input value="${esc(nd.reason)}" oninput="nd.reason=this.value;const e=document.getElementById('nsprev_nd');if(e)e.textContent='السبب: '+this.value">
  ${nsUI('nd','السبب: '+nd.reason)}
  ${nd.gdp>0?`<div class="m" style="margin-top:8px">الفاتورة الأصلية عليها خصم إجمالي، وينطبق تلقائياً على المرتجع بنفس النسبة (${+nd.gdp.toFixed(2)}%).</div>`:''}
  <div class="tot big"><span>إجمالي المرتجع</span><span id="rettot">${f(retAmount())}</span></div>
  <div id="errmsg" class="err"></div>
  <div class="acts"><button onclick="saveNote()">💾 حفظ الفاتورة المرتجعة</button><button class="g" onclick="go('view',{k:'inv',id:inv.id})">إلغاء</button></div></div></div>`;
  return}
 v.innerHTML=`<div class="wide"><div class="card"><h2>${nd.type==='credit'?'إشعار دائن':'إشعار مدين'} — فاتورة ${esc(nd.invNo)}</h2>
 <div class="m">العميل: ${esc(cn(inv))} · إجمالي الفاتورة: ${f(inv.total)}</div>
 <label>التاريخ</label><input type="date" value="${nd.date}" onchange="nd.date=this.value">
 <label>المبلغ</label><input type="number" inputmode="decimal" value="${nd.amount}" oninput="nd.amount=+this.value">
 <label>السبب</label><input value="${esc(nd.reason)}" oninput="nd.reason=this.value">
 <div id="errmsg" class="err"></div>
 <div class="acts"><button onclick="saveNote()">💾 حفظ الإشعار</button><button class="g" onclick="go('view',{k:'inv',id:inv.id})">إلغاء</button></div></div></div>`}
async function saveNote(){
 const amount=nd.isReturn?retAmount():nd.amount;
 if(!(amount>0))return showErr('أدخل مبلغاً أكبر من صفر، أو حدّد كمية إرجاع لصنف واحد على الأقل');
 const c=cusOf(nd.cid),inv0=st.inv.find(i=>i.no===nd.invNo);
 const rec={id:uid(),status:'issued',no:await allocNo(nd.type==='credit'?'cn':'dn'),ts:new Date().toISOString(),type:nd.type,isReturn:nd.isReturn,invNo:nd.invNo,invDate:inv0?inv0.date:'',cid:nd.cid,cs:c?{...c,addr:caddr(c)}:null,date:nd.date,amount:r2(amount),reason:nd.reason||''};
 if(nd.isReturn){rec.incl=!!nd.incl;rec.items=nd.items.filter(l=>l.retQty>0).map(l=>{const x=retLine(l);return{n:l.n,desc:l.desc||'',q:x.q,p:l.p,disc:x.disc,dt:l.dt==='a'?'a':'p'}});
  const t=calc(rec.items,nd.incl,nd.gdp,'p');rec.gd=nd.gdp||0;rec.gdt='p';rec.gross=t.gross;rec.gdisc=t.gdisc;rec.sub=t.sub;rec.tax=t.tax;rec.total=t.total;rec.ns={...defNs(),...(nd.ns||{})}}
 st.cnotes.push(rec);S('cnotes');cloudSet('cnotes',rec.id,rec);toast(nd.isReturn?'تم حفظ الفاتورة المرتجعة':'تم حفظ الإشعار');
 if(nd.isReturn)go('retv',rec.id);else{const inv=st.inv.find(i=>i.no===nd.invNo);go('view',{k:'inv',id:inv.id})}}
function retHTML(r){const c=custOf(r);
 const rows=(r.items||[]).map(l=>`<tr><td>${esc(l.n)}${l.desc?`<div class="custdetail" style="margin-top:2px">${esc(l.desc)}</div>`:''}</td><td class="c">${f(r.incl?l.p/1.15:l.p)}</td><td class="c">${l.q}</td><td class="c">${discLabel(l)}</td><td class="c">${f(net(l,!!r.incl))}</td></tr>`).join('');
 return `<div class="doc" id="docsrc"><div class="dh">
 <div><img class="lg" src="${getLogo()}"><div class="dno"><b>رقم الفاتورة المرتجعة</b><div class="n" dir="ltr">${esc(r.no)}</div><div class="dt">التاريخ<br><span dir="ltr">${r.date}</span></div></div></div>
 <div class="dh-l"><div class="cn">${esc(st.set.name)}</div><div class="sm">الرقم الضريبي: <span dir="ltr">${esc(st.set.vat)}</span><br>س.ت: <span dir="ltr">${esc(st.set.cr)}</span><br>${esc(st.set.addr)}</div><div class="totbadge" dir="ltr">${money(r.total)}</div></div></div>
 <div class="dtitle">فاتورة مرتجعة (إشعار دائن)</div>
 <div class="sm" style="margin-bottom:10px">مرجع الفاتورة الأصلية: <b dir="ltr">${esc(r.invNo)}</b>${r.invDate?' — تاريخ <span dir="ltr">'+r.invDate+'</span>':''}</div>
 <table class="it"><tr><th>البند</th><th class="c">سعر الوحدة</th><th class="c">الكمية المرتجعة</th><th class="c">الخصم</th><th class="c">المجموع</th></tr>${rows}</table>
 <div class="sum"><div class="sr">${c?`<div class="sm">مرتجع من</div><div class="custname">${esc(c.n)}</div>${c.vat?`<div class="custdetail">الرقم الضريبي: ${esc(c.vat)}</div>`:''}${c.cr?`<div class="custdetail">س.ت: ${esc(c.cr)}</div>`:''}`:'<div class="sm">عميل نقدي</div>'}
 <div class="qr">${qrImg(r)}</div></div>
 <div class="sl">${gdRows(r)}<div class="tr"><span>الإجمالي غير شامل الضريبة</span><span>${money(r.sub)}</span></div><div class="tr"><span>ضريبة القيمة المضافة (15%)</span><span>${money(r.tax)}</span></div><div class="tr b"><span>إجمالي المرتجع</span><span>${money(r.total)}</span></div></div></div>
 ${noteBlock(r.reason?'السبب: '+r.reason:'',r.ns)}</div>`}
function pRetV(v){const r=st.cnotes.find(x=>x.id===arg);if(!r)return go('retmgmt');
 const inv=st.inv.find(i=>i.no===r.invNo);
 v.innerHTML=`<div class="wide">${exportBar('return-'+r.no.replace(/\D/g,''))}<div class="acts np">
 ${inv?`<button class="g" onclick="go('view',{k:'inv',id:inv.id})">📄 الفاتورة الأصلية</button>`:''}
 <button class="g" style="background:#dc2626;color:#fff;border-color:#dc2626" onclick="delReturn('${r.id}')">🗑 حذف</button>
 <button class="g" onclick="go('retmgmt')">رجوع</button></div>
 ${pageWrap(retHTML(r))}</div>`}
function delReturn(id){ask('حذف هذه الفاتورة المرتجعة نهائياً؟ سيرجع المبلغ ضمن رصيد الفاتورة الأصلية.',()=>{st.cnotes=st.cnotes.filter(x=>x.id!==id);S('cnotes');cloudDel('cnotes',id);toast('تم الحذف');go('retmgmt')})}
function pRetMgmt(v){const rows=st.cnotes.filter(n=>n.isReturn&&dateOk(n.date,'ret')).slice().reverse();
 v.innerHTML=`<div class="wide"><div class="acts"><button onclick="go('notesl')">+ إرجاع فاتورة جديدة</button></div>
 <div class="card">${dateRangeBar('ret')}<input placeholder="🔍 بحث بالرقم أو العميل أو رقم الفاتورة" oninput="filt(this.value)" style="margin-bottom:8px"><div id="lst">${rows.map(n=>`<div class="li" data-q="${esc((n.no+' '+cn(n)+' '+n.invNo).toLowerCase())}" onclick="go('retv','${n.id}')"><span>${esc(n.no)} — فاتورة ${esc(n.invNo)}<br><span class="m">${esc(cn(n))} · ${n.date}${n.items?' · '+n.items.length+' صنف':''}</span></span><b>${f(n.amount)}</b></div>`).join('')||'<div class="m">لا توجد فواتير مرتجعة</div>'}</div></div></div>`}
function pNotesList(v){
 v.innerHTML=`<div class="wide"><div class="card"><h2>إرجاع فاتورة جديدة</h2><div class="m" style="margin-bottom:8px">اكتب رقم الفاتورة الضريبية الصادرة، وسيتم نسخ كل أصنافها تلقائياً لتحديد المرتجع منها.</div>
 <div class="row"><input id="retno" placeholder="مثال: INV-00007" style="flex:2"><button onclick="startReturnByNo()">بدء الإرجاع</button></div>
 <div id="errmsg" class="err"></div></div>
 <div class="acts"><button class="g" onclick="go('retmgmt')">🗂️ عرض كل الفواتير المرتجعة</button></div></div>`}

/* ---------- purchase invoices ---------- */
let newFolderName='',renamingFolderId=null,renameFolderVal='';
function pPurchF(v){v.innerHTML=`<div class="wide"><div class="card"><h2>مجلد جديد</h2><div class="row"><input id="nfName" placeholder="مثال: فواتير مشتريات سبتمبر 2026" value="${esc(newFolderName)}" oninput="newFolderName=this.value"><button onclick="addFolder()">+ إنشاء</button></div><div id="errmsg" class="err"></div></div>
 <div class="card">${st.pfold.map(f=>{const cnt=st.purch.filter(p=>p.folderId===f.id).length;
  if(renamingFolderId===f.id)return `<div class="li" style="cursor:default"><input value="${esc(renameFolderVal)}" oninput="renameFolderVal=this.value" style="flex:1"><button class="s" onclick="saveRenameFolder(${f.id})">حفظ</button><button class="g s" onclick="renamingFolderId=null;draw()">إلغاء</button></div>`;
  return `<div class="li" onclick="go('purchd',${f.id})"><span>📁 ${esc(f.name)}<br><span class="m">${cnt} ملف</span></span><span><button class="g s" onclick="event.stopPropagation();startRenameFolder(${f.id},'${esc(f.name).replace(/'/g,"\\'")}')">تعديل</button> <button class="r s" onclick="event.stopPropagation();delFolder(${f.id})">حذف</button></span></div>`}).join('')||'<div class="m">لا توجد مجلدات. أنشئ مجلداً أولاً (مثل: فواتير مشتريات سبتمبر)</div>'}</div></div>`}
function addFolder(){const name=newFolderName.trim();if(!name)return showErr('اكتب اسماً للمجلد أولاً');
 const id=Date.now();st.pfold.push({id,name});S('pfold');newFolderName='';toast('تم إنشاء المجلد');draw()}
function startRenameFolder(id,name){renamingFolderId=id;renameFolderVal=name;draw()}
function saveRenameFolder(id){const name=renameFolderVal.trim();if(!name)return;const f=st.pfold.find(x=>x.id===id);f.name=name;S('pfold');renamingFolderId=null;toast('تم التعديل');draw()}
function delFolder(id){ask('حذف المجلد وكل الفواتير بداخله؟',()=>{st.purch=st.purch.filter(p=>p.folderId!==id);st.pfold=st.pfold.filter(f=>f.id!==id);S('pfold');S('purch');draw()})}
function pPurchD(v){const f=st.pfold.find(x=>x.id===arg);if(!f)return go('purchf');
 const items=st.purch.filter(p=>p.folderId===arg);
 v.innerHTML=`<div class="wide"><div class="acts">
 <label class="g" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">📷 تصوير فاتورة<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPurch(this.files[0],${arg})"></label>
 <label class="g" style="display:inline-flex;align-items:center;justify-content:center;cursor:pointer">📎 رفع ملف (صورة/PDF)<input type="file" accept="image/*,application/pdf" style="display:none" onchange="addPurch(this.files[0],${arg})"></label>
 ${items.length?'<button onclick="downloadFolderPDF('+arg+')">⬇️ تنزيل الكل PDF</button>':''}</div>
 <div class="card" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px">${items.map(p=>`<div style="text-align:center;cursor:pointer" onclick="go('purchv','${p.id}')">${p.type==='image'?`<img src="${p.data}" style="width:100%;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--b)">`:'<div style="width:100%;height:100px;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--bg);border-radius:8px">📄</div>'}<div class="m" style="margin-top:4px;word-break:break-word">${esc(p.name)}</div></div>`).join('')||'<div class="m">لا توجد فواتير في هذا المجلد بعد</div>'}</div>
 <div class="acts"><button class="g" onclick="go('purchf')">رجوع للمجلدات</button></div></div>`}
function addPurch(file,folderId){if(!file)return;
 const isImg=file.type.startsWith('image/');
 const reader=new FileReader();
 reader.onload=e=>{
  if(isImg){
   const img=new Image();img.onload=()=>{
    const maxW=1200,scale=Math.min(1,maxW/img.width);
    const cv=document.createElement('canvas');cv.width=img.width*scale;cv.height=img.height*scale;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const data=cv.toDataURL('image/jpeg',0.72);
    savePurchItem(folderId,file.name,'image',data)};
   img.src=e.target.result}
  else savePurchItem(folderId,file.name,'pdf',e.target.result)};
 reader.readAsDataURL(file)}
function savePurchItem(folderId,name,type,data){
 const p={id:uid(),folderId,name:name||('فاتورة '+today()),type,data,createdAt:Date.now()};
 st.purch.push(p);
 if(!S('purch')){toast('⚠️ الصورة كبيرة جداً على مساحة تخزين الجهاز. جرّب صورة أصغر أو امسح ملفات قديمة');st.purch.pop();return}
 toast('تم الحفظ');draw()}
function pPurchV(v){const p=st.purch.find(x=>x.id===arg);if(!p)return go('purchf');
 v.innerHTML=`<div class="wide"><div class="card" style="text-align:center">
 ${p.type==='image'?`<img src="${p.data}" style="max-width:100%;border-radius:8px">`:`<div style="padding:40px">📄 ملف PDF: ${esc(p.name)}</div>`}
 <input value="${esc(p.name)}" style="margin-top:10px" onchange="renamePurch('${p.id}',this.value)"></div>
 <div class="acts"><button onclick="downloadPurchItem('${p.id}')">⬇️ تنزيل</button><button class="r" onclick="delPurch('${p.id}')">🗑 حذف</button><button class="g" onclick="go('purchd',${p.folderId})">رجوع</button></div></div>`}
function renamePurch(id,name){const p=st.purch.find(x=>x.id===id);if(p){p.name=name;S('purch')}}
function delPurch(id){ask('حذف هذا الملف؟',()=>{const p=st.purch.find(x=>x.id===id);st.purch=st.purch.filter(x=>x.id!==id);S('purch');toast('تم الحذف');go('purchd',p?p.folderId:null)})}
async function downloadPurchItem(id){const p=st.purch.find(x=>x.id===id);if(!p)return;
 try{const dl=await DLP;if(!dl)return toast('التنزيل غير متاح هنا');
  if(p.type==='pdf'){const bin=atob(p.data.split(',')[1]);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
   await dl.save({filename:p.name.endsWith('.pdf')?p.name:p.name+'.pdf',data:new Blob([arr],{type:'application/pdf'})})}
  else{const J=window.jspdf.jsPDF,img=new Image();await new Promise(res=>{img.onload=res;img.src=p.data});
   const pdf=new J({unit:'mm',format:'a4'});let w=210,h=img.height*210/img.width;if(h>297){w=img.width*297/img.height;h=297}
   pdf.addImage(p.data,'JPEG',(210-w)/2,0,w,h);await dl.save({filename:p.name.replace(/\.[^.]+$/,'')+'.pdf',data:pdf.output('blob')})}
  toast('تم')}catch(e){toast('تعذّر التنزيل')}}
async function downloadFolderPDF(folderId){const items=st.purch.filter(p=>p.folderId===folderId);if(!items.length)return;
 try{const dl=await DLP;if(!dl)return toast('التنزيل غير متاح هنا');
  const J=window.jspdf.jsPDF,pdf=new J({unit:'mm',format:'a4'});let first=true;
  for(const p of items){if(!first)pdf.addPage();first=false;
   let dataUrl=p.data,imgType='JPEG';
   if(p.type==='pdf'){pdf.setFontSize(14);pdf.text(p.name+' (PDF مرفق غير مضمّن هنا)',15,20);continue}
   const img=new Image();await new Promise(res=>{img.onload=res;img.src=dataUrl});
   let w=210,h=img.height*210/img.width;if(h>297){w=img.width*297/img.height;h=297}
   pdf.addImage(dataUrl,imgType,(210-w)/2,0,w,h)}
  const f=st.pfold.find(x=>x.id===folderId);
  await dl.save({filename:(f?f.name:'purchases')+'.pdf',data:pdf.output('blob')});toast('تم')}catch(e){toast('تعذّر إنشاء الملف')}}

applyDesignVars();
try{history.replaceState({pg,arg},'',location.href)}catch(e){}

  if(appLocked)lockScreen('enter');else draw();
 }else{
  cloudReady=false;DB=null;UID=null;
  loginScreen();
 }
});
});
